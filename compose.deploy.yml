services:

  proxy:
    restart: always
    ports:
      # LAN deployment: plain HTTP only. Let's Encrypt cannot issue certificates
      # for a private address, so there is no HTTPS entrypoint or redirect.
      - "80:80"
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    restart: always

  adminer:
    restart: always
    labels:
      # Adminer is a database console; do not expose it on the network
      - traefik.enable=false

  backend:
    restart: always
    environment:
      FRONTEND_HOST: http://${DOMAIN:?Variable not set}
